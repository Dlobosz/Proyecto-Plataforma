services:
  mysql:
    image: mysql:8.0
    container_name: plataforma-mysql
    restart: unless-stopped
    environment:
      # root: solo uso administrativo, la app nunca se conecta con este usuario.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: plataforma
      # El backend se conecta con este usuario. La imagen oficial de MySQL le da
      # privilegios solo sobre MYSQL_DATABASE (no privilegios globales/root).
      MYSQL_USER: plataforma_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    ports:
      # Solo localhost: nada fuera de esta maquina puede conectarse al puerto.
      - "127.0.0.1:3307:3306"
    volumes:
      - plataforma_mysql_data:/var/lib/mysql

volumes:
  plataforma_mysql_data:
