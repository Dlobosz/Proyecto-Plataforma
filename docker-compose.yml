x-logging:
  &default-logging
  logging:
    driver: json-file
    options:
      max-size: 100M

services:
  mysql:
    image: mysql:8.0
    container_name: plataforma-mysql
    restart: unless-stopped
    environment:
      # root: solo uso administrativo, la app nunca se conecta con este usuario.
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: plataforma
      # El backend se conecta con este usuario. La imagen oficial de MySQL le da
      # privilegios solo sobre MYSQL_DATABASE (no privilegios globales/root).
      MYSQL_USER: plataforma_app
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD}
    ports:
      # Solo localhost: nada fuera de esta maquina puede conectarse al puerto.
      - "127.0.0.1:3307:3306"
    volumes:
      - plataforma_mysql_data:/var/lib/mysql

  # --- Judge0 self-hosted (motor de ejecucion, ver CLAUDE.md seccion 5) ---
  # Config oficial de https://github.com/judge0/judge0 v1.13.1, adaptada:
  # puerto atado a 127.0.0.1 y con AUTHN_TOKEN habilitado (ver judge0/judge0.conf).
  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: plataforma-judge0-server
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    privileged: true
    <<: *default-logging
    restart: unless-stopped
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-workers:
    image: judge0/judge0:1.13.1
    container_name: plataforma-judge0-workers
    command: ["./scripts/workers"]
    volumes:
      - ./judge0/judge0.conf:/judge0.conf:ro
    privileged: true
    <<: *default-logging
    restart: unless-stopped
    depends_on:
      - judge0-db
      - judge0-redis

  judge0-db:
    image: postgres:16.2
    container_name: plataforma-judge0-db
    env_file: judge0/judge0.conf
    volumes:
      - judge0_db_data:/var/lib/postgresql/data/
    <<: *default-logging
    restart: unless-stopped

  judge0-redis:
    image: redis:7.2.4
    container_name: plataforma-judge0-redis
    command: [
      "bash", "-c",
      'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"'
    ]
    env_file: judge0/judge0.conf
    <<: *default-logging
    restart: unless-stopped

volumes:
  plataforma_mysql_data:
  judge0_db_data:
