spring.application.name=plataforma
server.port=18081

# --- MySQL (contenedor Docker plataforma-mysql, ver docker-compose.yml en la raiz) ---
spring.datasource.url=jdbc:mysql://localhost:3307/plataforma?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=plataforma
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Judge0 CE via RapidAPI ---
# Completar con la API key real de tu suscripcion en RapidAPI antes de correr el proyecto.
judge0.api.url=https://judge0-ce.p.rapidapi.com
judge0.api.key=TU_RAPIDAPI_KEY_AQUI
judge0.api.host=judge0-ce.p.rapidapi.com

# --- CORS ---
app.cors.allowed-origin=http://localhost:5173
