spring.application.name=plataforma
server.port=18081
# Solo localhost: es una herramienta de un solo usuario, uso local (ver CLAUDE.md seccion 2).
server.address=127.0.0.1
# spring-boot-devtools expone el stack trace completo en las respuestas de error por
# defecto en modo dev; lo desactivamos explicitamente (no es informacion que deba viajar
# en una respuesta HTTP, ni siquiera en localhost).
server.error.include-stacktrace=never

# Los secretos (password de MySQL, API key de Judge0) viven en application-local.properties,
# que NO se commitea (ver .gitignore). Copiar application-local.properties.example y completar.
spring.profiles.active=local

# --- MySQL (contenedor Docker plataforma-mysql, ver docker-compose.yml en la raiz) ---
# El backend se conecta como "plataforma_app" (no root), con privilegios solo sobre esta base.
spring.datasource.url=jdbc:mysql://localhost:3307/plataforma?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=plataforma_app
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# --- Judge0 ---
# Sin valores por defecto aca: judge0.api.url/key/host/auth-token viven en
# application-local.properties (self-hosted por defecto si no se define nada,
# ver Judge0Config). Asi cambiar de self-hosted a RapidAPI (o viceversa) es
# solo editar ese archivo, sin tocar codigo ni este archivo trackeado.

# --- CORS ---
app.cors.allowed-origin=http://localhost:5173
